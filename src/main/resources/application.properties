quarkus.application.name=bots

# =====================================================================
#  Secrets never live in this file (it ends up inside the jar and the
#  image). They come from the environment: ECS task secrets (Secrets
#  Manager / SSM) in AWS, or a local .env file in the working directory
#  (git-ignored, read automatically by Quarkus):
#    JDBC_URL, DB_USERNAME, DB_PASSWORD, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
#  The app refuses to start without the database ones.
# =====================================================================

# =====================================================================
#  Market database access (Postgres/Supabase)
# =====================================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${JDBC_URL}
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}

# The bot never generates or alters the schema: tables are created by the scripts in db/migrations.
quarkus.hibernate-orm.database.generation=none

# =====================================================================
#  HTTP: internal only. The REST endpoints (backtests, journal, alert
#  status) listen on the loopback interface, so nothing outside the
#  container/host can reach them; use them from inside (e.g. ECS Exec).
# =====================================================================
quarkus.http.host=127.0.0.1
quarkus.http.port=8080

# Configuration for health and alb standard endpoints (same as the data service): application routes live
# under /bots (e.g. /bots/liquidity-sweep/daily); the absolute /q keeps health at the standard path:
#   /q/health/live  → the alert loop is running; the ECS container health check uses this one
#   /q/health/ready → database reachable (automatic), Telegram configured, market data fresh in session
quarkus.http.root-path=/bots
quarkus.http.non-application-root-path=/q
quarkus.smallrye-health.root-path=health
quarkus.smallrye-health.liveness-path=live

# =====================================================================
#  Live Telegram alerts for strategy 4.2 (manual execution).
#  Off unless ALERTS_ENABLED=true. One alert per enabled row of the
#  funded_account table, each sized at its own share of the remaining
#  room; every alert is recorded in live_trade.
# =====================================================================
alerts.enabled=${ALERTS_ENABLED:false}
# When the alert loop wakes up (Quarkus cron: sec min hour day-of-month month day-of-week), read at startup, so ECS
# can change it through ALERTS_CRON without rebuilding the image. Default: every minute at :20 s (so the feed has
# written the minute that just closed), 08:00–15:59 Chicago, Monday to Friday. The session window itself
# (08:31–15:05) is enforced in code, so a wider cron is harmless; "off" disables the job altogether.
alerts.cron=${ALERTS_CRON:20 * 8-15 ? * MON-FRI}
alerts.cron-zone=${ALERTS_CRON_ZONE:America/Chicago}
# The native image needs HTTPS compiled in explicitly for the Telegram calls (JDK HttpClient).
quarkus.ssl.native=true
alerts.symbols=NQ.FUT,ES.FUT
telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
telegram.chat-id=${TELEGRAM_CHAT_ID:}

# =====================================================================
#  Daily backtest journal: after the close, the 4.2 backtest of the last
#  7 days is recorded in strategy_trade ("liquidity sweep 4.2"), next to
#  the live signals in live_trade. Idempotent, so it also fills missed
#  days. Same cron format as alerts.cron; "off" disables it.
# =====================================================================
backtest.journal.cron=${BACKTEST_CRON:0 30 15 ? * MON-FRI}
backtest.journal.cron-zone=${BACKTEST_CRON_ZONE:America/Chicago}
